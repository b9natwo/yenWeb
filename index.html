<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>jaydes library</title>
  <link rel="stylesheet" href="jaydes.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap">
</head>
<body>

<!-- Ambient background -->
<div class="bg-ambient">
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-grain"></div>
</div>

<header>
  <div class="header-inner">
    <div class="header-title-block">
      <h1>jaydes</h1>
      <p class="subtitle">jayden yen dumont</p>
    </div>

    <div class="header-controls">
      <!-- Released / Unreleased toggle -->
      <div class="release-toggle">
        <button class="toggle-btn active" data-mood="all-release">all</button>
        <button class="toggle-btn" data-mood="released">released</button>
        <button class="toggle-btn" data-mood="unreleased">unreleased</button>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search" placeholder="search songs…" autocomplete="off"/>
      </div>

      <div class="mood-filters">
        <button data-mood="all" class="active">all</button>
        <button data-mood="evvls">evvls</button>
        <button data-mood="mandy">mandy</button>
        <button data-mood="jaydes">jaydes</button>
        <button data-mood="yen">yen</button>
        <button id="random-btn" class="random-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          random
        </button>
      </div>
    </div>
  </div>
</header>

<main id="main-content"></main>

<!-- Global Player -->
<div class="global-player" id="global-player">
  <div class="player-inner">

    <div class="player-track-info">
      <div class="mini-art-wrap">
        <img id="current-art" src="" alt="" class="mini-art"/>
        <div class="art-playing-ring" id="art-ring"></div>
      </div>
      <div class="current-info">
        <div id="current-title">—</div>
        <div id="current-album">—</div>
      </div>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button id="shuffle-btn" class="ctrl-btn" title="Download">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button id="prev-btn" class="ctrl-btn">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button id="play-pause-btn" class="play-btn">
          <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" width="22" height="22" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button id="next-btn" class="ctrl-btn">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button id="queue-btn" class="ctrl-btn" title="Queue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>

      <div class="progress-row">
        <span id="current-time">0:00</span>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
          <input type="range" id="progress" min="0" max="100" value="0"/>
        </div>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <div class="volume-control">
        <button id="volume-btn" class="ctrl-btn vol-btn">
          <svg id="vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
        <div class="volume-slider-wrap">
          <input type="range" id="volume-slider" min="0" max="100" value="100"/>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Queue Modal -->
<div id="queue-modal" class="queue-modal" style="display:none;">
  <div class="queue-content">
    <div class="queue-header">
      <h3>queue</h3>
      <div class="queue-header-actions">
        <button id="clear-queue">clear all</button>
        <button id="close-queue" class="close-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <ul id="queue-list" class="sortable"></ul>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script src="jaydes.js"></script>
</body>
</html>
